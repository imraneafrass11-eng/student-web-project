<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail Etudiant - Notes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
                <img src="school logo.avif" alt="Logo">
                Portail Etudiant
            </a>
            <button class="navbar-toggler bg-light" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link fw-semibold" href="index.html">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="courses.html">Cours</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="todo.html">Taches</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold active" href="notes.html">Notes</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="main-content container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <h2 class="mb-4 text-dark text-center fw-bold">Espace Prise de Notes</h2>
                <div class="card shadow-sm p-4 border-0">
                    <form>
                        <div class="mb-3">
                            <label for="noteTitle" class="form-label fw-bold text-dark">Sujet de la session</label>
                            <input type="text" class="form-control form-control-lg bg-light" id="noteTitle" placeholder="Exemple : Synthese sur les bases de donnees">
                        </div>
                        <div class="mb-4">
                            <label for="noteContent" class="form-label fw-bold text-dark">Vos notes</label>
                            <textarea class="form-control notes-area bg-light" id="noteContent" placeholder="Commencez a taper vos notes ici..."></textarea>
                        </div>
                        <div class="d-flex justify-content-end gap-3">
                            <button type="reset" class="btn btn-outline-secondary px-4">Effacer tout</button>
                            <button type="button" class="btn btn-custom px-4">Sauvegarder</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p class="mb-0">&copy; 2026 Projet Scolaire. Tous droits reserves.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
